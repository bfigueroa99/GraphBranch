name: App de escritorio

# Arma los instaladores de la app de escritorio (Electron) en Linux, Windows y macOS.
#   - Al publicar un release: la versión sale de su tag (v1.2.3 → 1.2.3) y los instaladores
#     se adjuntan al release.
#   - A mano (Actions → App de escritorio → Run workflow): quedan como artefactos de la
#     ejecución, para probarlos sin publicar nada.
# Los builds solo leen el repo; el único job que puede escribir (subir al release) no corre
# código de npm.

on:
  release:
    types: [published]
  workflow_dispatch:
  push: # TEMPORAL: probar el flujo antes de que llegue a master
    branches: [claude/affectionate-brown-ukpmn6]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: macOS
            os: macos-latest
            args: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versión del tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::El tag \"$TAG\" no es una versión: usa v1.2.3 (o v1.2.3-beta.1)."
            exit 1
          fi
          npm pkg set version="$version"
      - name: Instaladores
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: graphbranch-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Adjuntar al release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Subir al release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
